[project]
name = "round-video-bot"
version = "2026.1.1"
description = "Telegram bot that converts videos into round video notes"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiogram>=3.28.0",
    "aiogram_i18n[compiler]>=1.4",
    "pydantic>=2.4",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.0",
    "ffmpeg-python>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=80.10.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
exclude = ["^build/"]

[[tool.mypy.overrides]]
module = "ffmpeg.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "A",       # builtins shadowing
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return
    "PIE",     # misc lints
    "PERF",    # performance
    "FURB",    # refurb
    "RUF",     # ruff-specific
    "ASYNC",   # blocking calls in async code
    "PTH",     # pathlib over os.path
    "LOG",     # logging misuse
    "G",       # logging format
    "T20",     # print
    "ISC",     # implicit string concat
    "TID",     # tidy imports
]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
